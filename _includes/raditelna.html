<script>
// Řazení tabulek class="raditelna" kliknutím na záhlaví sloupce (znovu = obráceně), výchozí podle 1. sloupce.
// Buňka s data-razeni se řadí podle té hodnoty místo textu. #x v adrese seřadí podle sloupce th[data-skupina]
// a skočí na první řádek tr[data-skupina="x"] (např. /pisne.phtml/#budovatelske).
(function () {
    var cesky = new Intl.Collator('cs', { numeric: true });
    Array.prototype.forEach.call(document.querySelectorAll('table.raditelna'), function (tabulka) {
        var telo = tabulka.tBodies[0], zahlavi = tabulka.tHead.rows[0].cells;
        function hodnota(radek, i) {
            var b = radek.cells[i];
            return b.hasAttribute('data-razeni') ? b.getAttribute('data-razeni') : b.textContent.trim();
        }
        function serad(i, sestupne) {
            var radky = Array.prototype.slice.call(telo.rows);
            radky.sort(function (a, b) {
                var x = hodnota(a, i), y = hodnota(b, i);
                if (!x !== !y) return x ? -1 : 1;          // prázdné buňky vždy na konec
                return (sestupne ? -1 : 1) * cesky.compare(x, y) || cesky.compare(hodnota(a, 0), hodnota(b, 0));
            });
            radky.forEach(function (r) { telo.appendChild(r); });
            for (var j = 0; j < zahlavi.length; j++) zahlavi[j].removeAttribute('aria-sort');
            zahlavi[i].setAttribute('aria-sort', sestupne ? 'descending' : 'ascending');
        }
        Array.prototype.forEach.call(zahlavi, function (th, i) {
            th.addEventListener('click', function () { serad(i, th.getAttribute('aria-sort') === 'ascending'); });
        });
        serad(0, false);
        var skupina = decodeURIComponent(location.hash.slice(1)), sloupec = tabulka.tHead.querySelector('th[data-skupina]');
        var prvni = skupina && sloupec && telo.querySelector('tr[data-skupina="' + skupina + '"]');
        if (prvni) { serad(sloupec.cellIndex, false); prvni.scrollIntoView(); }
    });
})();
</script>
