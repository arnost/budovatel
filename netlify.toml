# Cache v prohlížeči (výchozí Netlify je max-age=0, tj. ověřovat každý soubor při každé návštěvě):
# grafika vzhledu a knihovna galerie se nemění, ostatní obrázky a noty se mohou přegenerovat, proto jen na den.
# Cesty se nesmí překrývat (např. /img/*), Netlify by hodnoty obou pravidel spojil.
[[headers]]
  for = "/img/vzhled/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/unitegallery/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/img/galerie/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/img/nahledy/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/img/obrazky/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/img/pisne/*"
